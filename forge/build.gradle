plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "deadeye.mixins.json"
        mixinConfig "deadeye.forge.integrations.mixins.json"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

}

def rawGeckoLibJar = providers.provider {
    def candidates = fileTree(new File(gradle.gradleUserHomeDir, "caches/modules-2/files-2.1/curse.maven/geckolib-388172/7553267")) {
        include "**/geckolib-388172-7553267.jar"
    }.files

    if (candidates.isEmpty()) {
        throw new GradleException("Could not locate raw GeckoLib jar in Gradle cache.")
    }

    candidates.iterator().next()
}

def patchedGeckoLibJar = layout.buildDirectory.file("generated/forge-runtime-libs/geckolib-with-mclib-dev.jar")
def patchedGeckoLibTempDir = layout.buildDirectory.dir("tmp/geckolib-patched")

def patchGeckoLibForForgeDev = tasks.register("patchGeckoLibForForgeDev") {
    outputs.file(patchedGeckoLibJar)

    doLast {
        File targetJar = patchedGeckoLibJar.get().asFile
        File tempDir = patchedGeckoLibTempDir.get().asFile

        delete(tempDir)
        delete(targetJar)
        tempDir.mkdirs()
        targetJar.parentFile.mkdirs()

        copy {
            from(zipTree(rawGeckoLibJar.get()))
            into(tempDir)
        }

        ant.unzip(src: new File(tempDir, "META-INF/jarjar/mclib-20.jar"), dest: tempDir)
        ant.zip(destfile: targetJar, basedir: tempDir)
    }
}

def geckoLibPatchedRuntimeFiles = files(patchedGeckoLibJar).builtBy(patchGeckoLibForForgeDev)

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    // Resourceful Config
    modImplementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-forge-$rconfig_version"

    modCompileOnly "curse.maven:geckolib-388172:7553267"
    modCompileOnly "curse.maven:vics-point-blank-961053:7664533"
    modLocalRuntime geckoLibPatchedRuntimeFiles
    modLocalRuntime "curse.maven:vics-point-blank-961053:7664533"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
