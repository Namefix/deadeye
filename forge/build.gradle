plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "deadeye.mixins.json"
        mixinConfig "deadeye.forge.integrations.mixins.json"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

configurations.configureEach {
    exclude group: 'io.github.llamalad7', module: 'mixinextras-forge'
}

def resolveRawJar = { String dependencyNotation, String expectedFileName, String displayName ->
    def cfg = configurations.detachedConfiguration(dependencies.create(dependencyNotation))
    cfg.transitive = false

    def resolvedFiles = cfg.resolve()
    def candidates = resolvedFiles.findAll { it.name == expectedFileName }

    if (candidates.isEmpty()) {
        throw new GradleException("Could not resolve raw ${displayName} jar: expected ${expectedFileName} from ${dependencyNotation}")
    }

    candidates.iterator().next()
}

def rawGeckoLibJar = providers.provider {
    resolveRawJar("curse.maven:geckolib-388172:7553267", "geckolib-388172-7553267.jar", "GeckoLib")
}

def rawMixinExtrasJar = providers.provider {
    resolveRawJar("io.github.llamalad7:mixinextras-forge:0.5.5", "mixinextras-forge-0.5.5.jar", "MixinExtras forge")
}

def rawTaczJar = providers.provider {
    resolveRawJar("curse.maven:timeless-and-classics-zero-1028108:9037989", "timeless-and-classics-zero-1028108-9037989.jar", "TACZ")
}

def ensurePatchedJarInDevCache = { String outputName, File sourceJar, List<String> nestedJarPaths ->
    File devLibDir = rootProject.file('.gradle/devlibs')
    File tempDir = rootProject.file('.gradle/devlibs-tmp/' + outputName.replace('.jar', ''))
    File outputJar = new File(devLibDir, outputName)

    boolean needsRebuild = !outputJar.exists() || outputJar.lastModified() < sourceJar.lastModified()
    if (needsRebuild) {
        delete(tempDir)
        delete(outputJar)
        tempDir.mkdirs()
        devLibDir.mkdirs()

        String sourceManifestText = null
        new java.util.jar.JarFile(sourceJar).withCloseable { jarFile ->
            def manifestEntry = jarFile.getJarEntry('META-INF/MANIFEST.MF')
            if (manifestEntry != null) {
                sourceManifestText = jarFile.getInputStream(manifestEntry).getText('UTF-8')
            }
        }

        copy {
            from(zipTree(sourceJar))
            into(tempDir)
        }

        nestedJarPaths.each { nestedPath ->
            File nestedJar = new File(tempDir, nestedPath)
            if (!nestedJar.exists()) {
                throw new GradleException("Expected nested jar not found while patching ${sourceJar.name}: ${nestedPath}")
            }
            ant.unzip(src: nestedJar, dest: tempDir)
            delete(nestedJar)
        }

        if (sourceManifestText != null) {
            File manifestOut = new File(tempDir, 'META-INF/MANIFEST.MF')
            manifestOut.parentFile.mkdirs()
            manifestOut.setText(sourceManifestText, 'UTF-8')
        }

        ant.zip(destfile: outputJar, basedir: tempDir)
    }

    return outputJar
}


def patchedGeckoLibJar = providers.provider {
    ensurePatchedJarInDevCache(
        'geckolib-with-mclib-dev.jar',
        rawGeckoLibJar.get(),
        ['META-INF/jarjar/mclib-20.jar']
    )
}

def patchedMixinExtrasJar = providers.provider {
    ensurePatchedJarInDevCache(
        'mixinextras-forge-with-bootstrap-fixed.jar',
        rawMixinExtrasJar.get(),
        ['META-INF/jars/MixinExtras-0.5.5.jar']
    )
}

def patchedTaczJar = providers.provider {
    ensurePatchedJarInDevCache(
        'tacz-with-jarjar.jar',
        rawTaczJar.get(),
        [
            'META-INF/jarjar/luaj-jse-3.0.8-figura.jar',
            'META-INF/jarjar/luaj-core-3.0.8-figura.jar',
            'META-INF/jarjar/commons-math3-3.6.1.jar',
            'META-INF/jarjar/bcel-6.6.1.jar'
        ]
    )
}

def extractNestedJar = { String outputName, File sourceJar, String nestedJarPath, List<String> subNestedJarPaths ->
    File devLibDir = rootProject.file('.gradle/devlibs')
    File tempDir = rootProject.file('.gradle/devlibs-tmp/' + outputName.replace('.jar', ''))
    File outputJar = new File(devLibDir, outputName)

    boolean needsRebuild = !outputJar.exists() || outputJar.lastModified() < sourceJar.lastModified()
    if (needsRebuild) {
        delete(tempDir)
        delete(outputJar)
        tempDir.mkdirs()
        devLibDir.mkdirs()

        File nestedZip = new File(tempDir, 'nested.jar')
        new java.util.zip.ZipFile(sourceJar).withCloseable { zip ->
            def entry = zip.getEntry(nestedJarPath)
            if (entry == null) throw new GradleException("Nested jar not found in ${sourceJar.name}: ${nestedJarPath}")
            nestedZip.withOutputStream { it << zip.getInputStream(entry) }
        }

        copy {
            from(zipTree(nestedZip))
            into(tempDir)
        }
        delete(nestedZip)

        subNestedJarPaths.each { subPath ->
            File subJar = new File(tempDir, subPath)
            if (subJar.exists()) {
                ant.unzip(src: subJar, dest: tempDir)
                delete(subJar)
            }
        }

        ant.zip(destfile: outputJar, basedir: tempDir)
    }

    return outputJar
}

def patchedSimpleBedrockModelJar = providers.provider {
    extractNestedJar(
        'simplebedrockmodel-with-mae-dev.jar',
        rawTaczJar.get(),
        'META-INF/jarjar/simplebedrockmodel-2.2.2-forge+mc1.20.1.jar',
        ['META-INF/jarjar/mae-1.1.2.jar']
    )
}

def geckoLibPatchedRuntimeFiles = files(patchedGeckoLibJar)
def mixinExtrasPatchedRuntimeFiles = files(patchedMixinExtrasJar)
def taczPatchedRuntimeFiles = files(patchedTaczJar)
def simpleBedrockModelPatchedRuntimeFiles = files(patchedSimpleBedrockModelJar)

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    // Resourceful Config
    modImplementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-forge-$rconfig_version"

    // Vic's Point Blank
    modCompileOnly("curse.maven:geckolib-388172:7553267") { transitive = false }
    modCompileOnly("curse.maven:vics-point-blank-961053:8855556") { transitive = false }
    modLocalRuntime geckoLibPatchedRuntimeFiles
    modLocalRuntime("curse.maven:vics-point-blank-961053:8855556") { transitive = false }

    // Timeless and Classics Zero
    modCompileOnly("curse.maven:timeless-and-classics-zero-1028108:9037989") { transitive = false }
    modLocalRuntime taczPatchedRuntimeFiles
    modLocalRuntime simpleBedrockModelPatchedRuntimeFiles

    // Just Enough Guns
    modCompileOnly("curse.maven:framework-549225:7573740")
    modCompileOnly("curse.maven:just-enough-guns-820727:8873359")
    modLocalRuntime("curse.maven:framework-549225:7573740")
    modLocalRuntime("curse.maven:just-enough-guns-820727:8873359")

    // Scorched Guns
    modCompileOnly("curse.maven:scorched-guns-802940:7232063")
    modLocalRuntime("curse.maven:scorched-guns-802940:7232063")
    modLocalRuntime("curse.maven:curios-309927:6418456")

    modLocalRuntime mixinExtrasPatchedRuntimeFiles

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
