plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

def resolveRawJar = { String dependencyNotation, String expectedFileName, String displayName ->
    def cfg = configurations.detachedConfiguration(dependencies.create(dependencyNotation))
    cfg.transitive = false

    def resolvedFiles = cfg.resolve()
    def candidates = resolvedFiles.findAll { it.name == expectedFileName }

    if (candidates.isEmpty()) {
        throw new GradleException("Could not resolve raw ${displayName} jar: expected ${expectedFileName} from ${dependencyNotation}")
    }

    candidates.iterator().next()
}

def rawTaczJar = providers.provider {
    resolveRawJar("curse.maven:tacz-1-21-1-1353462:9027337", "tacz-1-21-1-1353462-9027337.jar", "TACZ")
}

def ensurePatchedJarInDevCache = { String outputName, File sourceJar, List<String> nestedJarPaths ->
    File devLibDir = rootProject.file('.gradle/devlibs')
    File tempDir = rootProject.file('.gradle/devlibs-tmp/' + outputName.replace('.jar', ''))
    File outputJar = new File(devLibDir, outputName)

    boolean needsRebuild = !outputJar.exists() || outputJar.lastModified() < sourceJar.lastModified()
    if (needsRebuild) {
        delete(tempDir)
        delete(outputJar)
        tempDir.mkdirs()
        devLibDir.mkdirs()

        String sourceManifestText = null
        new java.util.jar.JarFile(sourceJar).withCloseable { jarFile ->
            def manifestEntry = jarFile.getJarEntry('META-INF/MANIFEST.MF')
            if (manifestEntry != null) {
                sourceManifestText = jarFile.getInputStream(manifestEntry).getText('UTF-8')
            }
        }

        copy {
            from(zipTree(sourceJar))
            into(tempDir)
        }

        nestedJarPaths.each { nestedPath ->
            File nestedJar = new File(tempDir, nestedPath)
            if (!nestedJar.exists()) {
                throw new GradleException("Expected nested jar not found while patching ${sourceJar.name}: ${nestedPath}")
            }
            ant.unzip(src: nestedJar, dest: tempDir)
            delete(nestedJar)
        }

        if (sourceManifestText != null) {
            File manifestOut = new File(tempDir, 'META-INF/MANIFEST.MF')
            manifestOut.parentFile.mkdirs()
            manifestOut.setText(sourceManifestText, 'UTF-8')
        }

        ant.zip(destfile: outputJar, basedir: tempDir)
    }

    return outputJar
}

def patchedTaczJar = providers.provider {
    ensurePatchedJarInDevCache(
        'tacz-with-jarjar.jar',
        rawTaczJar.get(),
        [
            'META-INF/jarjar/luaj-jse-3.0.8-figura.jar',
            'META-INF/jarjar/luaj-core-3.0.8-figura.jar',
            'META-INF/jarjar/commons-math3-3.6.1.jar',
            'META-INF/jarjar/bcel-6.6.1.jar'
        ]
    )
}

def extractNestedJar = { String outputName, File sourceJar, String nestedJarPath, List<String> subNestedJarPaths ->
    File devLibDir = rootProject.file('.gradle/devlibs')
    File tempDir = rootProject.file('.gradle/devlibs-tmp/' + outputName.replace('.jar', ''))
    File outputJar = new File(devLibDir, outputName)

    boolean needsRebuild = !outputJar.exists() || outputJar.lastModified() < sourceJar.lastModified()
    if (needsRebuild) {
        delete(tempDir)
        delete(outputJar)
        tempDir.mkdirs()
        devLibDir.mkdirs()

        File nestedZip = new File(tempDir, 'nested.jar')
        new java.util.zip.ZipFile(sourceJar).withCloseable { zip ->
            def entry = zip.getEntry(nestedJarPath)
            if (entry == null) throw new GradleException("Nested jar not found in ${sourceJar.name}: ${nestedJarPath}")
            nestedZip.withOutputStream { it << zip.getInputStream(entry) }
        }

        copy {
            from(zipTree(nestedZip))
            into(tempDir)
        }
        delete(nestedZip)

        subNestedJarPaths.each { subPath ->
            File subJar = new File(tempDir, subPath)
            if (subJar.exists()) {
                ant.unzip(src: subJar, dest: tempDir)
                delete(subJar)
            }
        }

        ant.zip(destfile: outputJar, basedir: tempDir)
    }

    return outputJar
}

def patchedSimpleBedrockModelJar = providers.provider {
    extractNestedJar(
        'simplebedrockmodel-with-mae-dev.jar',
        rawTaczJar.get(),
        'META-INF/jarjar/simplebedrockmodel-2.2.1-neoforge+mc1.21.1.jar',
        ['META-INF/jarjar/mae-1.1.2.jar']
    )
}

def taczPatchedRuntimeFiles = files(patchedTaczJar)
def simpleBedrockModelPatchedRuntimeFiles = files(patchedSimpleBedrockModelJar)

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Resourceful Config
    modImplementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-neoforge-$rconfig_version"

    // Vic's Point Blank
    modImplementation "curse.maven:geckolib-388172:8893490"
    modImplementation "curse.maven:vics-point-blank-961053:8855569"

    // Timeless and Classics Zero (UNOFFICIAL PORT)
    modCompileOnly("curse.maven:tacz-1-21-1-1353462:9027337") { transitive = false }
    modLocalRuntime taczPatchedRuntimeFiles
    modLocalRuntime simpleBedrockModelPatchedRuntimeFiles

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
